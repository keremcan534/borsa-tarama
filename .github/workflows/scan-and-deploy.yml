name: Tarama ve GitHub Pages yayını

on:
  # Kod push edilince de yayınla (Claude Code'un elle tetiklediği gibi)
  push:
    branches: [master]
  schedule:
    # Hafta içi, BIST kapanışı sonrası (~18:45 TR = 15:45 UTC)
    - cron: "45 15 * * 1-5"
    # Hafta içi, ABD kapanışı sonrası (~00:15 TR = 21:15 UTC)
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write # günlük rapor arşivi (reports/) repoya commit'lenir
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Marketleri tara, JSON ve günlük raporu üret
        run: python scripts/scan_to_json.py frontend/public/data reports

      # KAP adımlarının hiçbiri yayını engelleyemez: KAP, GitHub runner IP'lerine
      # zaman zaman 500 döndürüyor ve bu daha önce siteyi günlerce yayınsız bıraktı.
      # Veri alınamazsa arayüz "henüz veri yok" durumunu gösterir, sonraki koşular
      # yeniden dener.
      - name: Yayındaki fon pozisyon geçmişini koru
        run: |
          if curl -fsS \
            https://keremcan534.github.io/borsa-tarama/data/fund_stock_positions.json \
            -o /tmp/fund_stock_positions.json; then
            mv /tmp/fund_stock_positions.json frontend/public/data/fund_stock_positions.json
          else
            echo "Yayında pozisyon dosyası yok/ulaşılamadı; KAP'tan üretim denenecek."
          fi

      - name: Aylık KAP fon pozisyonlarını güncelle
        run: |
          POS=frontend/public/data/fund_stock_positions.json
          # Gerçek veri var mı? (dosya mevcut + en az bir ay içeriyor)
          has_data() {
            python -c "import json,sys; d=json.load(open('$POS')); sys.exit(0 if d.get('months') else 1)" 2>/dev/null
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "$(date -u +%d)" = "15" ] || \
             [ ! -s "$POS" ] || ! has_data; then
            python scripts/kap_fund_positions.py --output "$POS" \
              || echo "KAP güncellemesi başarısız (yayını engellemez; sonraki koşuda yeniden denenir)."
          else
            echo "Ayın 15'i değil; mevcut pozisyon geçmişi korunuyor."
          fi
          # Her durumda geçerli bir JSON bulunsun: arayüz boş durumu gösterebilir
          if [ ! -s "$POS" ] || ! python -c "import json; json.load(open('$POS'))" 2>/dev/null; then
            echo '{"generated_at": null, "months": [], "stocks": {}}' > "$POS"
            echo "Pozisyon verisi üretilemedi; boş iskelet yazıldı."
          fi

      - name: Rapor arşivini repoya commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if ! git diff --staged --quiet; then
            git commit -m "Günlük rapor arşivi (otomatik)"
            git push origin HEAD:master || echo "rapor push edilemedi (kritik değil)"
          else
            echo "yeni rapor yok, commit atlandı"
          fi

      - name: Rapor arşivi + sitemap + robots'u siteye hazırla
        run: python scripts/build_site_meta.py reports frontend/public

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci yerine npm install: Windows'ta üretilen package-lock.json,
      # Linux'a özgü opsiyonel native bağımlılıkları (@emnapi vb.) içermiyor
      # ve npm ci senkron kontrolünde takılıyor.
      - name: Frontend bağımlılıklarını kur
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Frontend'i statik modda build et
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: static
          VITE_BASE_PATH: /borsa-tarama/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # Bildirim adımları: ilgili secret'lar repoya eklenmediyse scriptler
      # kendileri atlar (secrets bağlamı step-level if'te kullanılamıyor).
      # Bildirim hatası yayını bozmasın diye continue-on-error açık.
      - name: Telegram bildirimi gönder
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py frontend/public/data

      - name: X (Twitter) paylaşımı gönder
        continue-on-error: true
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: python scripts/notify_twitter.py frontend/public/data
