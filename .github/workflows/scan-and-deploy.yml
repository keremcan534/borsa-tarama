name: Tarama ve GitHub Pages yayını

on:
  schedule:
    # Hafta içi, BIST kapanışı sonrası (~18:45 TR = 15:45 UTC)
    - cron: "45 15 * * 1-5"
    # Hafta içi, ABD kapanışı sonrası (~00:15 TR = 21:15 UTC)
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Marketleri tara ve JSON üret
        run: python scripts/scan_to_json.py frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci yerine npm install: Windows'ta üretilen package-lock.json,
      # Linux'a özgü opsiyonel native bağımlılıkları (@emnapi vb.) içermiyor
      # ve npm ci senkron kontrolünde takılıyor.
      - name: Frontend bağımlılıklarını kur
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Frontend'i statik modda build et
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: static
          VITE_BASE_PATH: /borsa-tarama/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # Bildirim adımları: ilgili secret'lar repoya eklenmediyse sessizce atlanır,
      # eklendiği anda otomatik devreye girer. Bildirim hatası yayını bozmasın
      # diye continue-on-error açık.
      - name: Telegram bildirimi gönder
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py frontend/public/data

      - name: X (Twitter) paylaşımı gönder
        if: ${{ secrets.TWITTER_API_KEY != '' }}
        continue-on-error: true
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: python scripts/notify_twitter.py frontend/public/data
