name: Tarama ve GitHub Pages yayını

on:
  schedule:
    # Hafta içi, BIST kapanışı sonrası (~18:45 TR = 15:45 UTC)
    - cron: "45 15 * * 1-5"
    # Hafta içi, ABD kapanışı sonrası (~00:15 TR = 21:15 UTC)
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Marketleri tara ve JSON üret
        run: python scripts/scan_to_json.py frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bağımlılıklarını kur
        run: npm ci
        working-directory: frontend

      - name: Frontend'i statik modda build et
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: static
          VITE_BASE_PATH: /borsa-tarama/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
